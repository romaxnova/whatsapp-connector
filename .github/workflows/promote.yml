name: Promote to stable
# The one-click Railway template deploys ghcr.io/<repo>:stable, not :latest, so friends' servers only
# get versions already running on the maintainer's own server. Run this from the Actions tab once a
# version has been checked there: it points :stable at that image (default: the current :latest).
# Deployed servers pick it up when they redeploy.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to promote: a commit SHA (full, as tagged by the Image workflow) or "latest"'
        required: true
        default: latest
permissions:
  contents: read
  packages: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Point :stable at the chosen image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in latest|[0-9a-f]*) ;; *) echo "Not a tag: $VERSION"; exit 1;; esac
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:stable" "$image:$VERSION"
          docker buildx imagetools inspect "$image:stable" | head -5
